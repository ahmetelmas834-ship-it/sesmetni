<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7c3aed">
  <title>SesMetni - Seslendirme Metni Hazırlama Aracı</title>
  <meta name="description" content="Türkçe içerik üreticileri için ücretsiz metin temizleme, kelime sayma ve seslendirme süresi hesaplama aracı.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="ust">
    <div class="marka">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="12" rx="3"></rect>
          <path d="M5 11a7 7 0 0 0 14 0"></path>
          <path d="M12 18v4"></path>
        </svg>
      </span>
      <h1>SesMetni</h1>
    </div>
    <p class="slogan">Seslendirme metnini temizle, düzenle ve süresini hesapla.</p>
  </header>

  <main class="kutu">
    <section class="kart">

      <label for="metin" class="baslik">Metnini buraya yapıştır</label>
      <textarea id="metin" rows="10" placeholder="Seslendirme metnini buraya yaz veya yapıştır..."></textarea>

      <div class="istatistik">
        <div><span id="kelimeSayisi">0</span><small>Kelime</small></div>
        <div><span id="karakterSayisi">0</span><small>Karakter</small></div>
        <div><span id="paragrafSayisi">0</span><small>Paragraf</small></div>
        <div><span id="sure">0 sn</span><small>Tahmini süre</small></div>
      </div>

      <div class="hiz">
        <label for="hiz">Konuşma hızı</label>
        <select id="hiz">
          <option value="110">Yavaş</option>
          <option value="140" selected>Normal</option>
          <option value="170">Hızlı</option>
        </select>
      </div>

      <div class="butonlar">
        <button id="temizleBtn" type="button">Metni Temizle</button>
        <button id="duzenleBtn" type="button" class="ikincil">Paragrafları Düzenle</button>
        <button id="kopyalaBtn" type="button" class="ikincil">Kopyala</button>
        <button id="indirBtn" type="button">TXT İndir</button>
      </div>

      <p id="mesaj" class="mesaj"></p>

    </section>
  </main>

  <footer class="alt">
    <p>SesMetni açık kaynaklı ve ücretsiz bir projedir. MIT Lisansı.</p>
    <p><a href="https://github.com/ahmetelmas834-ship-it/sesmetni">GitHub'da incele</a></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
